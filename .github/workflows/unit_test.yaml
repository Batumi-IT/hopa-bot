name: Unit tests

on:
  pull_request:
    branches: [main]

jobs:
  unit_test_go:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2

      - name: Run unit tests
        run: go test -v ./...
